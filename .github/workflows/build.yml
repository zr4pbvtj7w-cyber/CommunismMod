name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - name: debug class locations
        if: failure()
        run: |
          J=$(find ~/.gradle/caches .gradle -name "minecraft-merged*.jar" -o -name "minecraft-common*.jar" 2>/dev/null | grep -v sources | head -1)
          echo "JAR=$J"
          unzip -l "$J" | awk '{print $4}' | grep -E "/(Villager|VillagerData|FireworkRocketEntity|ItemEntity|Evoker|Vindicator|ItemLore|Fireworks|FireworkExplosion|Identifier|Relative|BedBlock|Heightmap|PotionContents|ServerBossEvent|ClickEvent|HoverEvent|BlockStateProperties|CommandSourceStack|PermissionSet|Permissions|MobEffects|Attributes|EntitySpawnReason)\.class$" || true
      - name: upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: communism-mod
          path: build/libs/*.jar

  selftest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: accept eula
        run: mkdir -p run && echo "eula=true" > run/eula.txt
      - name: run server self-test
        run: |
          chmod +x ./gradlew
          timeout 1200 ./gradlew runServer -Pselftest --console=plain 2>&1 | tee server.log || true
          grep -E "SELFTEST|Exception|ERROR" server.log | head -80 || true
          grep -q "COMMUNISM SELFTEST OK" server.log
