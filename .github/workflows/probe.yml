name: probe
on: [workflow_dispatch, push]

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: prepare minecraft jar
        run: chmod +x ./gradlew && ./gradlew compileJava --console=plain || true
      - name: javap
        run: |
          J=$(find ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged -name "*.jar" | grep -v sources | head -1)
          F=$(find ~/.gradle/caches -name "fabric-api-base*.jar" | head -1)
          unzip -l "$J" | awk '{print $4}' | grep -E "dialog/|/(Minecart|AbstractMinecart|Snowball|ThrowableItemProjectile|Cow|ImpossibleTrigger|CriteriaTriggers|Criterion|AdvancementRequirements|ClientboundShowDialogPacket|ClientboundClearDialogPacket|RailShape|ServerStatsCounter|Stats|NewMinecartBehavior|IronGolem)\.class$" | sort
          for c in net.minecraft.server.dialog.NoticeDialog net.minecraft.server.dialog.MultiActionDialog net.minecraft.server.dialog.ConfirmationDialog net.minecraft.server.dialog.CommonDialogData net.minecraft.server.dialog.DialogAction net.minecraft.server.dialog.ActionButton net.minecraft.server.dialog.CommonButtonData net.minecraft.server.dialog.body.PlainMessage net.minecraft.server.dialog.body.ItemBody net.minecraft.server.dialog.action.StaticAction net.minecraft.network.protocol.common.ClientboundShowDialogPacket net.minecraft.network.protocol.common.ClientboundClearDialogPacket net.minecraft.advancements.Advancement net.minecraft.advancements.AdvancementHolder net.minecraft.advancements.DisplayInfo net.minecraft.advancements.AdvancementType net.minecraft.advancements.AdvancementProgress net.minecraft.advancements.AdvancementRequirements net.minecraft.advancements.Criterion net.minecraft.network.protocol.game.ClientboundUpdateAdvancementsPacket net.minecraft.world.level.block.state.properties.RailShape; do echo "=== $c"; javap -cp "$J" $c | grep -v "lambda\$" | head -40; done
          for c in net.minecraft.world.entity.Entity; do echo "=== $c"; javap -cp "$J" $c | grep -E "startRiding|stopRiding|removeVehicle|teleportTo|snapTo|moveTo|setDeltaMovement|getVehicle|isPassenger|setNoGravity|getRootVehicle|ejectPassengers" ; done
          echo "=== Player"; javap -cp "$J" net.minecraft.world.entity.player.Player | grep -iE "dialog|getStats|awardStat"
          echo "=== ServerPlayer"; javap -cp "$J" net.minecraft.server.level.ServerPlayer | grep -iE "dialog|getStats|teleportTo|getAdvancements"
          echo "=== ServerLevel"; javap -cp "$J" net.minecraft.server.level.ServerLevel | grep -iE "setDayTime|setWeather|getDayTime|clock"
          echo "=== Level"; javap -cp "$J" net.minecraft.world.level.Level | grep -iE "setDayTime|getDayTime|isClientSide"
          echo "=== Stats"; javap -cp "$J" net.minecraft.stats.Stats | grep -iE "JUMP|CROUCH|SPRINT|CUSTOM"
          echo "=== ServerStatsCounter"; javap -cp "$J" net.minecraft.stats.ServerStatsCounter | grep -iE "getValue"
          echo "=== StatsCounter"; javap -cp "$J" net.minecraft.stats.StatsCounter | grep -iE "getValue"
          SB=$(unzip -l "$J" | awk '{print $4}' | grep -E "/Snowball\.class$" | sed 's/\.class//;s#/#.#g'); echo "=== $SB"; javap -cp "$J" $SB | head -20
          TP=$(unzip -l "$J" | awk '{print $4}' | grep -E "/ThrowableItemProjectile\.class$" | sed 's/\.class//;s#/#.#g'); echo "=== $TP"; javap -cp "$J" $TP | head -20
          MC=$(unzip -l "$J" | awk '{print $4}' | grep -E "/AbstractMinecart\.class$" | sed 's/\.class//;s#/#.#g'); echo "=== $MC"; javap -cp "$J" $MC | grep -E "public|protected" | head -40
          echo "=== Projectile"; P=$(unzip -l "$J" | awk '{print $4}' | grep -E "projectile/Projectile\.class$" | sed 's/\.class//;s#/#.#g'); javap -cp "$J" $P | grep -E "shoot|setOwner"
          echo "=== Mob"; javap -cp "$J" net.minecraft.world.entity.Mob | grep -iE "setDropChance|setLeashed|getNavigation|setTarget"
          echo "=== Villager"; V=$(unzip -l "$J" | awk '{print $4}' | grep -E "/Villager\.class$" | sed 's/\.class//;s#/#.#g'); echo $V
          echo "=== PlayerTeam"; javap -cp "$J" net.minecraft.world.scores.PlayerTeam | grep -iE "setPlayerPrefix|setColor"
          echo "=== MinecraftServer"; javap -cp "$J" net.minecraft.server.MinecraftServer | grep -iE "getPlayerList|overworld|isSingleplayer|getTickCount"
